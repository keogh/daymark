name: Native distribution builds

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag to build without publishing
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: native-distribution-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate tag and repository
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.release.outputs.commit }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out requested tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - name: Set up repository Node version
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Resolve immutable release inputs
        id: release
        shell: bash
        env:
          REQUESTED_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$REQUESTED_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          tag_commit="$(git rev-list -n 1 "$REQUESTED_TAG")"
          head_commit="$(git rev-parse HEAD)"
          test "$tag_commit" = "$head_commit"
          version="$(node -p "require('./package.json').version")"
          npm run release:validate -- --tag "$REQUESTED_TAG"
          echo "tag=$REQUESTED_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$head_commit" >> "$GITHUB_OUTPUT"
      - name: Install locked dependencies
        run: npm ci
      - name: Run baseline validation
        run: |
          npm run format:check
          npm run typecheck
          npm run lint
          npm test

  macos-arm64:
    name: Build macOS arm64 on macos-15
    needs: validate
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.commit }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Confirm native arm64 host
        run: test "$(uname -m)" = arm64
      - run: npm ci
      - run: npm run release:validate -- --tag "${{ needs.validate.outputs.tag }}"
      - run: npm run make:macos:arm64
      - run: npm run inspect:macos:arm64
      - name: Record artifact metadata
        run: >-
          node --experimental-strip-types scripts/workflow-artifacts.ts create
          --platform darwin --architecture arm64 --search-root out/make
          --output out/artifact-manifest.json
          --tag "${{ needs.validate.outputs.tag }}"
          --commit "${{ needs.validate.outputs.commit }}"
      - uses: actions/upload-artifact@v4
        with:
          name: Daymark-${{ needs.validate.outputs.version }}-darwin-arm64
          if-no-files-found: error
          retention-days: 14
          path: |
            out/make/**/Daymark-${{ needs.validate.outputs.version }}-darwin-arm64.dmg
            out/artifact-manifest.json

  macos-x64:
    name: Build macOS x64 on macos-15-intel
    needs: validate
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.commit }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Confirm native x64 host
        run: test "$(uname -m)" = x86_64
      - run: npm ci
      - run: npm run release:validate -- --tag "${{ needs.validate.outputs.tag }}"
      - run: npm run make:macos:x64
      - run: npm run inspect:macos:x64
      - name: Record artifact metadata
        run: >-
          node --experimental-strip-types scripts/workflow-artifacts.ts create
          --platform darwin --architecture x64 --search-root out/make
          --output out/artifact-manifest.json
          --tag "${{ needs.validate.outputs.tag }}"
          --commit "${{ needs.validate.outputs.commit }}"
      - uses: actions/upload-artifact@v4
        with:
          name: Daymark-${{ needs.validate.outputs.version }}-darwin-x64
          if-no-files-found: error
          retention-days: 14
          path: |
            out/make/**/Daymark-${{ needs.validate.outputs.version }}-darwin-x64.dmg
            out/artifact-manifest.json

  windows-x64:
    name: Build Windows x64 on windows-2025
    needs: validate
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.commit }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Confirm native x64 host
        shell: pwsh
        run: |
          if (-not [Environment]::Is64BitOperatingSystem -or $env:PROCESSOR_ARCHITECTURE -ne 'AMD64') {
            throw 'Windows build requires a native x64 runner'
          }
      - name: Use HTTPS for public GitHub dependencies
        shell: pwsh
        run: >-
          git config --global
          'url.https://github.com/.insteadOf'
          'ssh://git@github.com/'
      - run: npm ci
      - run: npm run release:validate -- --tag "${{ needs.validate.outputs.tag }}"
      - run: npm run make:windows:x64
      - run: npm run inspect:windows:x64
      - name: Record artifact metadata
        run: >-
          node --experimental-strip-types scripts/workflow-artifacts.ts create
          --platform win32 --architecture x64 --search-root out/make
          --output out/artifact-manifest.json
          --tag "${{ needs.validate.outputs.tag }}"
          --commit "${{ needs.validate.outputs.commit }}"
      - uses: actions/upload-artifact@v4
        with:
          name: Daymark-${{ needs.validate.outputs.version }}-win32-x64
          if-no-files-found: error
          retention-days: 14
          path: |
            out/make/**/Daymark-${{ needs.validate.outputs.version }}-win32-x64 Setup.exe
            out/artifact-manifest.json

  linux-x64:
    name: Build Linux x64 on ubuntu-24.04
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.commit }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Confirm native x64 host
        run: test "$(uname -m)" = x86_64
      - name: Install Debian maker tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends fakeroot dpkg
      - run: npm ci
      - run: npm run release:validate -- --tag "${{ needs.validate.outputs.tag }}"
      - run: npm run make:linux:x64
      - run: npm run inspect:linux:x64
      - name: Record artifact metadata
        run: >-
          node --experimental-strip-types scripts/workflow-artifacts.ts create
          --platform linux --architecture x64 --search-root out/make
          --output out/artifact-manifest.json
          --tag "${{ needs.validate.outputs.tag }}"
          --commit "${{ needs.validate.outputs.commit }}"
      - uses: actions/upload-artifact@v4
        with:
          name: Daymark-${{ needs.validate.outputs.version }}-linux-x64
          if-no-files-found: error
          retention-days: 14
          path: |
            out/make/**/Daymark-${{ needs.validate.outputs.version }}-linux-x64.deb
            out/artifact-manifest.json

  artifacts-valid:
    name: Validate complete artifact set
    needs:
      - validate
      - macos-arm64
      - macos-x64
      - windows-x64
      - linux-x64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.commit }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@v4
        with:
          pattern: Daymark-${{ needs.validate.outputs.version }}-*
          path: out/downloaded-artifacts
      - name: Validate artifact set and build provenance
        run: >-
          node --experimental-strip-types scripts/workflow-artifacts.ts validate
          --root out/downloaded-artifacts
          --tag "${{ needs.validate.outputs.tag }}"
          --commit "${{ needs.validate.outputs.commit }}"

  release-draft:
    name: Assemble draft GitHub prerelease
    if: github.event_name == 'push'
    needs:
      - validate
      - macos-arm64
      - macos-x64
      - windows-x64
      - linux-x64
      - artifacts-valid
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.commit }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@v4
        with:
          pattern: Daymark-${{ needs.validate.outputs.version }}-*
          path: out/downloaded-artifacts
      - name: Assemble and verify final release files
        run: >-
          npm run release:assemble --
          --input out/downloaded-artifacts
          --output out/release
          --tag "${{ needs.validate.outputs.tag }}"
          --commit "${{ needs.validate.outputs.commit }}"
      - name: Create release notes
        run: >-
          node --experimental-strip-types scripts/release-assembly.ts notes
          --output out/release-notes.md
          --tag "${{ needs.validate.outputs.tag }}"
          --commit "${{ needs.validate.outputs.commit }}"
      - name: Create or update unpublished prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
            gh release edit "$RELEASE_TAG" --draft --prerelease --target "$RELEASE_COMMIT" --notes-file out/release-notes.md
            while IFS= read -r asset; do
              gh release delete-asset "$RELEASE_TAG" "$asset" --yes
            done < <(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')
            gh release upload "$RELEASE_TAG" out/release/*
          else
            gh release create "$RELEASE_TAG" out/release/* --draft --prerelease --target "$RELEASE_COMMIT" --title "Daymark $RELEASE_TAG" --notes-file out/release-notes.md
          fi
